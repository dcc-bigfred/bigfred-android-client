name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Cache hydrus models assets
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: hydrus-models-${{ hashFiles('tools/hydrus-import/**') }}-${{ github.run_id }}
          restore-keys: |
            hydrus-models-${{ hashFiles('tools/hydrus-import/**') }}-
            hydrus-models-

      - name: Import hydrus models
        id: import-models
        continue-on-error: true
        run: make import-models

      - name: Require models assets
        run: |
          set -euo pipefail
          if [ -f app/src/main/assets/models/models.db ]; then
            if [ "${{ steps.import-models.outcome }}" != "success" ]; then
              echo "::warning::Import failed; using cached models.db + images"
            fi
            ls -lh app/src/main/assets/models/models.db
            echo "Images: $(find app/src/main/assets/models/images -type f 2>/dev/null | wc -l)"
          else
            echo "::error::No models.db (import failed and cache miss)"
            exit 1
          fi

      - name: Decode release keystore
        env:
          BIGFRED_STORE_FILE_CONTENT: ${{ secrets.BIGFRED_STORE_FILE_CONTENT }}
        run: |
          set -euo pipefail
          if [ -z "${BIGFRED_STORE_FILE_CONTENT:-}" ]; then
            echo "No BIGFRED_STORE_FILE_CONTENT secret; release APK will use debug signing"
            exit 0
          fi
          echo "$BIGFRED_STORE_FILE_CONTENT" | base64 -d > "${RUNNER_TEMP}/bigfred-release.jks"
          echo "BIGFRED_STORE_FILE=${RUNNER_TEMP}/bigfred-release.jks" >> "$GITHUB_ENV"

      - name: Set up Go (loco-server-android-arm64)
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: false

      - name: Set up Node (loco-server SPA embed)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout bigfred for loco-server-android-arm64
        uses: actions/checkout@v4
        with:
          repository: dcc-bigfred/bigfred
          # Prefer repo variable BIGFRED_REF; default to phone branch until merged to master.
          ref: ${{ vars.BIGFRED_REF || 'feat/bigfred-on-phone' }}
          path: .deps/bigfred

      - name: Build loco-server-android-arm64
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          make -C .deps/bigfred android
          mkdir -p native-prebuilt/arm64-v8a
          cp -f .deps/bigfred/bin/loco-server-android-arm64 \
            native-prebuilt/arm64-v8a/libloco-server.so
          chmod 755 native-prebuilt/arm64-v8a/libloco-server.so
          ls -lh native-prebuilt/arm64-v8a/libloco-server.so

      - name: Fetch Valkey / supervisord prebuilts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          make valkey-android supervisord-android
          ls -lh native-prebuilt/arm64-v8a/

      - name: Unit tests
        env:
          GRADLE_FLAGS: ""
        run: make test

      - name: Build release APK
        env:
          GRADLE_FLAGS: ""
          BIGFRED_STORE_PASSWORD: ${{ secrets.BIGFRED_STORE_PASSWORD }}
          BIGFRED_KEY_ALIAS: ${{ secrets.BIGFRED_KEY_ALIAS }}
          BIGFRED_KEY_PASSWORD: ${{ secrets.BIGFRED_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make apk

      - name: Verify APK contains loco-server
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libloco-server\.so' 
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libvalkey-server\.so'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libsupervisord\.so'

      - name: Stage APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="bigfred-android-${GITHUB_REF_NAME}.apk"
          else
            NAME="bigfred-android-${GITHUB_SHA::7}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 90

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Native loco-server for "BigFred on phone" (GitHub release of bigfred repo).
# Prefer local ../bigfred/bin/loco-server-android-arm64 when present.
# Example: bigfredNativeRepo=owner/bigfred  bigfredNativeTag=v1.2.3
bigfredNativeRepo=
bigfredNativeTag=

# Valkey / supervisord Android prebuilts (latest GitHub release of each deps repo).
depsAndroidValkeyRepo=dcc-bigfred/deps-android-valkey
depsAndroidSupervisordRepo=dcc-bigfred/deps-android-supervisord
